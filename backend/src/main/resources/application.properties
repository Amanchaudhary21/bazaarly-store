spring.application.name=shopnest

# Port 8081: the store's own pages run on 8080 (start.bat / npm start)
server.port=8081

# Secrets (database password, owner password) can go in backend/local.properties,
# which is not uploaded to GitHub. Environment variables work too.
spring.config.import=optional:file:./local.properties

# MySQL. The "shopnest" database is made the first time the server starts.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopnest?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Only these accounts can delete or restore products
app.owner-emails=amanecdy@gmail.com
# Password the owner types on the Sell page to connect to this server.
# If empty, one is made up and printed when the server starts.
app.owner-password=${OWNER_PASSWORD:}
# Web addresses allowed to call the API
app.cors-origins=http://localhost:8080,http://127.0.0.1:8080,https://amanchaudhary21.github.io
app.demo-codes=true
